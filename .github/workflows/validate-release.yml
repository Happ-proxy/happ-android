name: Build

on:
  push:
    paths:
      - 'release'
      - '.github/workflows/validate-release.yml'
  pull_request:
    paths:
      - 'release'
      - '.github/workflows/validate-release.yml'
  workflow_dispatch:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          if [ ! -f release ]; then
            echo "::error file=release::File 'release' does not exist in the root directory."
            exit 1
          fi

          jq empty release
